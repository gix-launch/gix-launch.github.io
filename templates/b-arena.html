<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Capstone Arena — Template B</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --tint: #f3f2ee;
    --ink: #111111;
    --muted: #5f5f5f;
    --line: #111111;
    --hair: #dddad2;
    --accent: #e8461e;
    --accent-2: #2546f0;
    --sans: "Space Grotesk", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 var(--sans); }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 24px; }
  .mono { font-family: var(--mono); }

  header { border-bottom: 2px solid var(--line); }
  header .wrap { display: flex; justify-content: space-between; align-items: center; height: 64px; }
  .logo { font-weight: 700; font-size: 20px; letter-spacing: -.02em; }
  .logo b { color: var(--accent); }
  nav a { font-family: var(--mono); font-size: 13px; color: var(--ink); text-decoration: none; margin-left: 20px; text-transform: uppercase; }
  nav a:hover { color: var(--accent); }

  .hero { padding-top: 64px; padding-bottom: 48px; display: grid; grid-template-columns: 1.3fr 1fr; gap: 48px; align-items: end; }
  .hero h1 { font-size: clamp(56px, 9vw, 120px); line-height: .9; margin: 0; letter-spacing: -.05em; font-weight: 700; }
  .hero h1 em { font-style: normal; color: var(--accent); }
  .hero p { font-size: 18px; color: var(--muted); max-width: 520px; margin: 24px 0 0; }
  .countdown { border: 2px solid var(--line); padding: 24px; box-shadow: 8px 8px 0 var(--accent); background: #fff; }
  .countdown .label { font-family: var(--mono); font-size: 12px; text-transform: uppercase; color: var(--muted); }
  .countdown .what { font-size: 22px; font-weight: 700; margin: 6px 0 16px; }
  .clock { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .clock div { background: var(--tint); padding: 12px 6px; text-align: center; }
  .clock strong { display: block; font-family: var(--mono); font-size: 32px; font-weight: 600; }
  .clock span { font-family: var(--mono); font-size: 11px; color: var(--muted); text-transform: uppercase; }

  .ticker { border-top: 2px solid var(--line); border-bottom: 2px solid var(--line); background: var(--ink); color: #fff; overflow: hidden; white-space: nowrap; font-family: var(--mono); font-size: 13px; padding: 10px 0; }
  .ticker span { margin-right: 48px; }
  .ticker b { color: #ffb199; font-weight: 600; }

  section { padding: 80px 0; }
  section.tint { background: var(--tint); }
  .kicker { font-family: var(--mono); font-size: 13px; color: var(--accent); text-transform: uppercase; }
  h2 { font-size: clamp(36px, 5vw, 56px); margin: 8px 0 32px; letter-spacing: -.03em; line-height: 1; }

  .corners { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 2px solid var(--line); border-left: 2px solid var(--line); }
  .corner { border-right: 2px solid var(--line); border-bottom: 2px solid var(--line); padding: 24px; background: #fff; display: flex; flex-direction: column; gap: 10px; min-height: 260px; }
  .corner:hover { background: #fff7f4; }
  .corner .top { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 12px; color: var(--muted); text-transform: uppercase; }
  .corner h3 { font-size: 26px; margin: 0; letter-spacing: -.02em; line-height: 1.1; }
  .corner .who { font-weight: 500; color: var(--accent-2); }
  .corner p { margin: 0; color: var(--muted); font-size: 15px; }
  .corner .skills { margin-top: auto; font-family: var(--mono); font-size: 12px; }

  .tape { width: 100%; border-collapse: collapse; border: 2px solid var(--line); background: #fff; }
  .tape th { font-family: var(--mono); font-size: 13px; text-transform: uppercase; padding: 16px; border-bottom: 2px solid var(--line); text-align: left; width: 50%; }
  .tape th:first-child { border-right: 2px solid var(--line); }
  .tape td { padding: 14px 16px; border-bottom: 1px solid var(--hair); vertical-align: top; }
  .tape td:first-child { border-right: 2px solid var(--line); }
  .tape .side { display: inline-block; width: 10px; height: 10px; margin-right: 8px; }

  .schedule { list-style: none; margin: 0; padding: 0; border-top: 2px solid var(--line); }
  .schedule li { display: grid; grid-template-columns: 160px 1fr 120px; gap: 24px; padding: 20px 0; border-bottom: 1px solid var(--hair); align-items: baseline; }
  .schedule .date { font-family: var(--mono); font-size: 14px; }
  .schedule h4 { margin: 0; font-size: 22px; letter-spacing: -.01em; }
  .schedule p { margin: 4px 0 0; color: var(--muted); }
  .schedule .owner { font-family: var(--mono); font-size: 12px; text-transform: uppercase; text-align: right; }
  .schedule li.past { opacity: .45; }
  .schedule li.next h4::before { content: "▶ "; color: var(--accent); }

  .stack { display: flex; height: 56px; border: 2px solid var(--line); margin-bottom: 24px; }
  .stack div { display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 13px; font-weight: 600; border-right: 2px solid var(--line); }
  .stack div:last-child { border-right: 0; }
  .grades { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
  .grade { border: 2px solid var(--line); padding: 18px; background: #fff; }
  .grade .w { font-family: var(--mono); font-size: 28px; font-weight: 600; }
  .grade h4 { margin: 4px 0; font-size: 18px; }
  .grade p { margin: 0; font-size: 14px; color: var(--muted); }
  .grade .meta { margin-top: 10px; font-family: var(--mono); font-size: 12px; }

  details { border: 2px solid var(--line); background: #fff; margin-bottom: -2px; }
  summary { cursor: pointer; padding: 18px 20px; font-size: 20px; font-weight: 700; display: flex; justify-content: space-between; list-style: none; }
  summary::-webkit-details-marker { display: none; }
  summary .mono { font-size: 14px; font-weight: 400; }
  details[open] summary { border-bottom: 1px solid var(--hair); }
  .levels { display: grid; grid-template-columns: repeat(4, 1fr); }
  .level { padding: 16px 20px; border-right: 1px solid var(--hair); font-size: 15px; }
  .level:last-child { border-right: 0; }
  .level b { display: block; font-family: var(--mono); font-size: 12px; text-transform: uppercase; margin-bottom: 6px; }

  footer { border-top: 2px solid var(--line); padding: 32px 0 56px; font-family: var(--mono); font-size: 13px; color: var(--muted); }

  @media (max-width: 860px) {
    nav { display: none; }
    .hero { grid-template-columns: 1fr; }
    .corners { grid-template-columns: 1fr; }
    .schedule li { grid-template-columns: 1fr; gap: 4px; }
    .schedule .owner { text-align: left; }
    .levels { grid-template-columns: 1fr; }
    .level { border-right: 0; border-bottom: 1px solid var(--hair); }
    .stack div span { display: none; }
  }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="logo" id="logo"></div>
    <nav>
      <a href="#corners">The projects</a>
      <a href="#tape">The deal</a>
      <a href="#schedule">Schedule</a>
      <a href="#grading">Grading</a>
      <a href="#rubric">Rubric</a>
    </nav>
  </div>
</header>

<div class="wrap hero">
  <div>
    <div class="kicker" id="kicker"></div>
    <h1>Six sponsors.<br>One <em>showcase</em>.</h1>
    <p id="tagline"></p>
  </div>
  <div class="countdown" aria-live="polite">
    <div class="label">Next milestone</div>
    <div class="what" id="next-what"></div>
    <div class="clock">
      <div><strong id="cd-d">0</strong><span>days</span></div>
      <div><strong id="cd-h">0</strong><span>hours</span></div>
      <div><strong id="cd-m">0</strong><span>min</span></div>
      <div><strong id="cd-s">0</strong><span>sec</span></div>
    </div>
  </div>
</div>

<div class="ticker" id="ticker"></div>

<section id="corners">
  <div class="wrap">
    <div class="kicker">The projects</div>
    <h2>Every corner, one sponsor.</h2>
    <div class="corners" id="corner-grid"></div>
  </div>
</section>

<section id="tape" class="tint">
  <div class="wrap">
    <div class="kicker">The deal</div>
    <h2>Tale of the tape.</h2>
    <table class="tape" id="tape-table"></table>
  </div>
</section>

<section id="schedule">
  <div class="wrap">
    <div class="kicker">Schedule</div>
    <h2>From pitch to showcase.</h2>
    <ul class="schedule" id="schedule-list"></ul>
  </div>
</section>

<section id="grading" class="tint">
  <div class="wrap">
    <div class="kicker">Assignments</div>
    <h2>How the grade adds up.</h2>
    <div class="stack" id="stack"></div>
    <div class="grades" id="grade-cards"></div>
  </div>
</section>

<section id="rubric">
  <div class="wrap">
    <div class="kicker">The rules</div>
    <h2>Grading rubric.</h2>
    <div id="rubric-list"></div>
  </div>
</section>

<footer><div class="wrap" id="footer"></div></footer>

<script src="shared/data.js"></script>
<script>
(() => {
  const D = window.CAPSTONE;
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const fmt = (iso) => new Date(iso + "T12:00:00").toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" }).toUpperCase();
  const today = new Date().toISOString().slice(0, 10);
  const nextIdx = D.milestones.findIndex((m) => m.date >= today);
  const STACK_COLORS = ["#e8461e", "#2546f0", "#ffd23f", "#111111", "#7bd389", "#f2a7c3", "#c9c4b8"];

  $("logo").innerHTML = `${esc(D.course)} <b>Capstone</b>`;
  $("kicker").textContent = `${D.program} · ${D.year}`;
  $("tagline").textContent = D.tagline;

  // Countdown
  const next = D.milestones[nextIdx === -1 ? D.milestones.length - 1 : nextIdx];
  $("next-what").textContent = next.title;
  const target = new Date(next.date + "T09:00:00").getTime();
  const tick = () => {
    const ms = Math.max(0, target - Date.now());
    $("cd-d").textContent = Math.floor(ms / 864e5);
    $("cd-h").textContent = Math.floor(ms / 36e5) % 24;
    $("cd-m").textContent = Math.floor(ms / 6e4) % 60;
    $("cd-s").textContent = Math.floor(ms / 1e3) % 60;
  };
  tick();
  setInterval(tick, 1000);

  $("ticker").innerHTML = D.milestones.map((m) => `<span><b>${fmt(m.date)}</b> ${esc(m.title)}</span>`).join("");

  $("corner-grid").innerHTML = D.sponsors.map((s, i) => `
    <article class="corner">
      <div class="top"><span>Corner ${String(i + 1).padStart(2, "0")}</span><span>${esc(s.sector)}</span></div>
      <h3>${esc(s.project)}</h3>
      <div class="who">${esc(s.name)}</div>
      <p>${esc(s.summary)}</p>
      <div class="skills">${s.skills.map(esc).join(" / ")} · ${s.team} students</div>
    </article>`).join("");

  const { students, sponsors } = D.expectations;
  const rows = Math.max(students.length, sponsors.length);
  $("tape-table").innerHTML =
    `<tr><th><span class="side" style="background:var(--accent)"></span>Students</th><th><span class="side" style="background:var(--accent-2)"></span>Sponsors</th></tr>` +
    Array.from({ length: rows }, (_, i) => `<tr><td>${esc(students[i] || "")}</td><td>${esc(sponsors[i] || "")}</td></tr>`).join("");

  $("schedule-list").innerHTML = D.milestones.map((m, i) => {
    const cls = nextIdx === -1 || i < nextIdx ? "past" : i === nextIdx ? "next" : "";
    return `<li class="${cls}">
      <div class="date">${fmt(m.date)}</div>
      <div><h4>${esc(m.title)}</h4><p>${esc(m.detail)}</p></div>
      <div class="owner">${esc(m.owner)}</div></li>`;
  }).join("");

  $("stack").innerHTML = D.assignments.map((a, i) => {
    const dark = ["#111111", "#2546f0", "#e8461e"].includes(STACK_COLORS[i]);
    return `<div style="flex:${a.weight};background:${STACK_COLORS[i]};color:${dark ? "#fff" : "#111"}" title="${esc(a.name)}">${a.weight}<span>%</span></div>`;
  }).join("");
  $("grade-cards").innerHTML = D.assignments.map((a, i) => `
    <div class="grade" style="border-top:8px solid ${STACK_COLORS[i]}">
      <div class="w">${a.weight}%</div>
      <h4>${esc(a.name)}</h4>
      <p>${esc(a.description)}</p>
      <div class="meta">DUE ${fmt(a.due)} · SPONSOR: ${esc(a.sponsorRole).toUpperCase()}</div>
    </div>`).join("");

  $("rubric-list").innerHTML = D.rubric.map((r, i) => `
    <details ${i === 0 ? "open" : ""}>
      <summary>${esc(r.criterion)} <span class="mono">${r.weight}%  +</span></summary>
      <div class="levels">${r.levels.map((l, j) => `<div class="level"><b>${D.rubricLevels[j]}</b>${esc(l)}</div>`).join("")}</div>
    </details>`).join("");

  $("footer").textContent = `${D.course} · ${D.program} · ${D.year} — sample content, sponsors are placeholders.`;
})();
</script>
</body>
</html>
