<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact · Launch Studio</title>
<link rel="icon" href="assets/logos/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body data-page="contact">
<main class="wrap">
  <div class="hero">
    <div class="eyebrow">Contact</div>
    <h1>Get in touch</h1>
    <p class="lede">Questions about the course, your student team, or sponsorship? Here is who to contact.</p>
  </div>
  <section>
    <div class="contact-grid">
      <div>
        <h2 style="font-size:24px">Who to contact</h2>
        <div id="contact-groups"></div>
      </div>
      <div class="box">
        <h3>Send a message</h3>
        <p class="muted" style="margin-top:0">This opens your email app with the message ready to send.</p>
        <form id="contact-form" novalidate>
          <div class="field"><label for="f-name">Your name</label><input id="f-name" name="name" autocomplete="name"><div class="field-error" id="e-name"></div></div>
          <div class="field"><label for="f-email">Your email</label><input id="f-email" name="email" type="email" autocomplete="email"><div class="field-error" id="e-email"></div></div>
          <div class="field"><label for="f-role">I am a…</label>
            <select id="f-role" name="role"><option>Current sponsor</option><option>Prospective sponsor</option><option>Other</option></select></div>
          <div class="field"><label for="f-recipient">Contact</label><select id="f-recipient" name="recipient"></select><div class="field-error" id="e-recipient"></div></div>
          <div class="field"><label for="f-message">Message</label><textarea id="f-message" name="message"></textarea><div class="field-error" id="e-message"></div></div>
          <button class="btn" type="submit">Open email draft</button>
          <div class="form-status" id="form-status" role="status"></div>
        </form>
      </div>
    </div>
  </section>
</main>

<script src="assets/js/assignments.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/utils.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/contact.js"></script>
</body>
</html>
